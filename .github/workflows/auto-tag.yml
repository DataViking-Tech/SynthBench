name: Auto Semver Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.check.outputs.skipped }}
      tag: ${{ steps.bump.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse semver labels
        id: check
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          SEMVER_LABELS=$(echo "$LABELS" | jq -r '.[] | select(startswith("semver:"))' | grep -v '^semver:skip$' || true)
          SKIP=$(echo "$LABELS" | jq -r '.[] | select(. == "semver:skip")' || true)

          if [ -n "$SKIP" ]; then
            echo "semver:skip label found — skipping release"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(echo "$SEMVER_LABELS" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "No semver label found — skipping release"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple semver labels found: $(echo $SEMVER_LABELS | tr '\n' ', '). Use exactly one."
            exit 1
          fi

          BUMP="${SEMVER_LABELS#semver:}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      # Latest run per check name only. The check-runs API returns runs from
      # every check suite on the SHA, so a PR created with --label fires
      # opened + labeled twin ci.yml runs, concurrency cancels one, and the
      # cancelled run parks on the SHA forever — counting it blocked v0.3.1
      # (PR #334), which had to be tagged manually. The logic lives in a
      # standalone script so it can be exercised directly against any SHA
      # (see the script header for usage).
      - name: Verify CI checks passed
        if: steps.check.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/verify-ci-checks.sh

      - name: Compute next version
        if: steps.check.outputs.skipped != 'true'
        id: bump
        env:
          BUMP: ${{ steps.check.outputs.bump }}
        run: |
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No existing tags found — starting from v0.0.0"
          fi
          echo "Latest tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "::error::Unknown bump type: $BUMP"
              exit 1
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New tag: $NEW_TAG"

      - name: Create and push tag
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG=$(printf 'Release %s (PR #%s: %s)' "$NEW_TAG" "$PR_NUMBER" "$PR_TITLE")
          git tag -a "$NEW_TAG" -m "$MSG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.skipped != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${NEW_TAG#v}"
          gh release create "$NEW_TAG" --generate-notes --title "v$VERSION"

  # Publish to PyPI as `synthbench-eval` via GitHub Trusted Publishing (OIDC).
  # Lives in this workflow (rather than a tag-triggered one) because the tag
  # above is pushed with GITHUB_TOKEN, and GITHUB_TOKEN pushes do not trigger
  # other workflows. Trusted publisher must be registered on PyPI with:
  #   project = synthbench-eval, owner = DataViking-Tech, repo = SynthBench,
  #   workflow = auto-tag.yml, environment = pypi
  # pyproject.toml carries a placeholder version; the real version is stamped
  # from the tag here at build time (tags are the version source of truth —
  # committing bumps back to main would need a bypass-capable bot identity).
  publish-pypi:
    name: Publish synthbench-eval to PyPI
    needs: auto-tag
    if: needs.auto-tag.outputs.skipped != 'true' && needs.auto-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.auto-tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        env:
          NEW_TAG: ${{ needs.auto-tag.outputs.tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/synthbench/__init__.py
          grep -n '^version' pyproject.toml
          grep -n '^__version__' src/synthbench/__init__.py

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          ls -lh dist/

      # skip-existing makes manual re-runs idempotent.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Summarize
        env:
          NEW_TAG: ${{ needs.auto-tag.outputs.tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          {
            echo "## Published synthbench-eval ${VERSION}"
            echo ""
            echo "- PyPI: https://pypi.org/project/synthbench-eval/${VERSION}/"
            echo "- Install: \`pip install synthbench-eval==${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
